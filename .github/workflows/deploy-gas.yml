name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'gas/**'
  workflow_dispatch:

# The web app URL in src/config.js points at a specific deployment ID
# (not @HEAD), so `clasp push` alone isn't enough — the deployment has
# to be re-pointed at the newly pushed version too. Update this if the
# deployment is ever recreated.
env:
  CLASP_DEPLOYMENT_ID: AKfycbyiKasAHQVaTZWMROTFV88caPB7jGAtDecnbTj3MVZdAqZs8x9YCcFEkKbwKIiLWOtZEg

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # A failing test stops the job before clasp pushes anything.
      - run: npm test
      - run: npm run typecheck

      - name: Configure clasp credentials
        run: |
          echo "${{ secrets.CLASPRC_JSON }}" | base64 -d > ~/.clasprc.json
          cat <<EOF > .clasp.json
          {
            "scriptId": "${{ secrets.CLASP_SCRIPT_ID }}",
            "rootDir": "gas"
          }
          EOF

      - run: npx clasp push --force

      - name: Get commit subject
        id: commit
        run: echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      # Apps Script deployment descriptions are capped at 165 characters;
      # trim so a long commit title still deploys instead of failing.
      - name: Deploy
        env:
          DEPLOY_DESCRIPTION: ${{ steps.commit.outputs.subject }}
        run: npx clasp deploy --deploymentId "$CLASP_DEPLOYMENT_ID" --description "${DEPLOY_DESCRIPTION:0:160}"
